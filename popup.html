<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Word Filter</title>
  <style>
    body { 
      width: 400px; 
      padding: 1rem; 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
      margin: 0;
    }
    h3 { margin: 0 0 0.5rem 0; color: #333; }
    
    /* Toggle Switch */
    .toggle-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
      padding: 0.75rem;
      background: #f5f5f5;
      border-radius: 4px;
    }
    .toggle-label { font-weight: 600; font-size: 14px; }
    .toggle-switch {
      position: relative;
      width: 50px;
      height: 26px;
    }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc;
      transition: .4s;
      border-radius: 26px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: #0066cc; }
    input:checked + .slider:before { transform: translateX(24px); }
    
    /* Table Styles */
    .table-container {
      max-height: 250px;
      overflow-y: auto;
      border: 1px solid #ddd;
      border-radius: 4px;
      margin-bottom: 1rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th {
      background: #f5f5f5;
      padding: 0.5rem;
      text-align: left;
      border-bottom: 2px solid #ddd;
      font-weight: 600;
      font-size: 12px;
      position: sticky;
      top: 0;
    }
    td {
      padding: 0.4rem;
      border-bottom: 1px solid #eee;
      font-size: 13px;
    }
    tr:last-child td { border-bottom: none; }
    input[type="text"] {
      width: 100%;
      padding: 0.3rem;
      border: 1px solid #ddd;
      border-radius: 3px;
      font-size: 13px;
      box-sizing: border-box;
    }
    input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }
    
    /* Buttons */
    .btn-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }
    button {
      padding: 0.5rem 0.75rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      flex: 1;
    }
    .btn-primary { background: #0066cc; color: white; }
    .btn-secondary { background: #e0e0e0; color: #333; }
    .btn-danger { background: #dc3545; color: white; padding: 0.3rem 0.5rem; }
    .btn-add { background: #28a745; color: white; }
    
    /* Status */
    .status { 
      font-size: 0.8rem; 
      color: #666; 
      padding: 0.5rem;
      background: #f5f5f5;
      border-radius: 4px;
    }
    .status.error {
      background: #f8d7da;
      color: #721c24;
    }
    .status.success {
      background: #d4edda;
      color: #155724;
    }
    
    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 1rem;
      color: #666;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <h3>🔇 Word Filter</h3>
  
  <div class="toggle-container">
    <span class="toggle-label">Filter Enabled</span>
    <label class="toggle-switch">
      <input type="checkbox" id="enableToggle" checked>
      <span class="slider"></span>
    </label>
  </div>
  
  <div class="table-container">
    <table id="rulesTable">
      <thead>
        <tr>
          <th style="width: 40px;">✓</th>
          <th style="width: 100px;">Find</th>
          <th style="width: 100px;">Replace</th>
          <th style="width: 50px;"></th>
        </tr>
      </thead>
      <tbody id="rulesBody">
        <!-- Rules will be inserted here -->
      </tbody>
    </table>
    <div id="emptyState" class="empty-state">
      No rules configured. Click "Add Rule" below.
    </div>
  </div>
  
  <div class="btn-row">
    <button id="addRuleBtn" class="btn-add">+ Add Rule</button>
    <button id="saveBtn" class="btn-primary">Save</button>
  </div>
  
  <div class="btn-row">
    <button id="refreshBtn" class="btn-secondary">↻ Refresh Page</button>
    <button id="resetBtn" class="btn-secondary">Reset Defaults</button>
  </div>
  
  <div id="status" class="status">Loading...</div>
  
  <script src="popup.js"></script>
</body>
</html>
